<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="選股儀表板">
<meta name="theme-color" content="#0a0a0f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>美股選股系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --bg3: #181825;
  --border: #1e1e2e;
  --border2: #2a2a3e;
  --text: #e2e2f0;
  --text2: #8888aa;
  --text3: #555575;
  --accent: #7c6af7;
  --accent2: #5c4fd6;

  --green: #00ff88;
  --green-dim: #00c86820;
  --green-border: #00c86840;
  --red: #ff4466;
  --red-dim: #ff224420;
  --red-border: #ff224440;
  --yellow: #ffc93c;
  --yellow-dim: #ffc93c18;
  --gray-dim: #ffffff08;
  --gray-border: #ffffff15;

  --signal-strong: #00ff88;
  --signal-buy: #4fc3f7;
  --signal-neutral: #ffc93c;
  --signal-watch: #555575;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── LAYOUT ── */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  max-width: 480px;
  margin: 0 auto;
}

/* ── HEADER ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.header-title {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--text2);
  letter-spacing: 0.05em;
}

.header-title span { color: var(--accent); }

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--green-dim);
  border: 1px solid var(--green-border);
  border-radius: 20px;
  padding: 3px 9px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--green);
  letter-spacing: 0.1em;
}

.live-dot {
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.header-time {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text3);
}

/* ── CONTENT ── */
.page {
  flex: 1;
  padding: 16px;
  padding-bottom: calc(80px + var(--safe-bottom));
  display: none;
}
.page.active { display: block; }

/* ── NAV ── */
.nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  z-index: 100;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: var(--safe-bottom);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 4px;
  gap: 3px;
  cursor: pointer;
  transition: color 0.2s;
  color: var(--text3);
  font-size: 10px;
  border: none;
  background: none;
  -webkit-tap-highlight-color: transparent;
}

.nav-item.active { color: var(--accent); }
.nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }

/* ── REFRESH BTN ── */
.refresh-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none;
  border-radius: 12px;
  color: #fff;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 0.03em;
}
.refresh-btn:active { transform: scale(0.98); }
.refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.refresh-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.refresh-btn.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SECTION TITLE ── */
.section-title {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 10px;
  margin-top: 20px;
}
.section-title:first-child { margin-top: 0; }

/* ── MARKET CARDS ── */
.market-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.market-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}

.market-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 14px 14px 0 0;
}

.market-card.up::before { background: var(--green); }
.market-card.down::before { background: var(--red); }

.mc-symbol {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.mc-price {
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.mc-change {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  margin-bottom: 10px;
}

.mc-change.up { color: var(--green); }
.mc-change.down { color: var(--red); }

.mc-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.mc-stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.mc-stat-label {
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.mc-stat-value {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text2);
}

/* ── REGIME BANNER ── */
.regime-banner {
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.regime-banner.risk_on {
  background: var(--green-dim);
  border: 1px solid var(--green-border);
}
.regime-banner.risk_off {
  background: var(--red-dim);
  border: 1px solid var(--red-border);
}
.regime-banner.neutral {
  background: var(--yellow-dim);
  border: 1px solid #ffc93c30;
}

.regime-label {
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 4px;
}

.regime-value {
  font-family: 'Space Mono', monospace;
  font-size: 16px;
  font-weight: 700;
}

.regime-banner.risk_on .regime-value { color: var(--green); }
.regime-banner.risk_off .regime-value { color: var(--red); }
.regime-banner.neutral .regime-value { color: var(--yellow); }

.regime-icon { font-size: 28px; }

/* ── VIX CARD ── */
.vix-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.vix-left {}
.vix-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.vix-value {
  font-family: 'Space Mono', monospace;
  font-size: 28px;
  font-weight: 700;
}
.vix-change {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  margin-top: 2px;
}

.vix-level {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 500;
}

.vix-level.calm { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
.vix-level.neutral { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #ffc93c30; }
.vix-level.fear { background: #ff880020; color: #ff8800; border: 1px solid #ff880040; }
.vix-level.extreme_fear { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-border); }

/* ── STOCK CARDS ── */
.stock-card {
  background: var(--bg3);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s;
  border: 1.5px solid transparent;
}

.stock-card:active { transform: scale(0.99); }

.stock-card.signal-strong_buy { border-color: var(--signal-strong); background: linear-gradient(135deg, #00ff8808, var(--bg3)); }
.stock-card.signal-buy { border-color: var(--signal-buy); background: linear-gradient(135deg, #4fc3f708, var(--bg3)); }
.stock-card.signal-neutral_positive { border-color: var(--signal-neutral); background: linear-gradient(135deg, #ffc93c08, var(--bg3)); }
.stock-card.signal-watch { border-color: var(--border); }

.sc-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}

.sc-left {}
.sc-rank {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  margin-bottom: 3px;
}

.sc-symbol {
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}

.sc-name {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 2px;
}

.sc-industry {
  font-size: 10px;
  color: var(--text3);
}

.sc-right {
  text-align: right;
}

.sc-score {
  font-family: 'Space Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 4px;
}

.sc-score-max {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--text3);
}

.signal-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 0.03em;
}

.signal-badge.signal-strong_buy { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
.signal-badge.signal-buy { background: #4fc3f720; color: var(--signal-buy); border: 1px solid #4fc3f740; }
.signal-badge.signal-neutral_positive { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #ffc93c30; }
.signal-badge.signal-watch { background: var(--gray-dim); color: var(--text3); border: 1px solid var(--gray-border); }

.sc-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.sc-stat-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sc-stat-label {
  font-size: 9px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.sc-stat-value {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text2);
}

.sc-trade {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.sc-trade-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sc-trade-label { font-size: 9px; color: var(--text3); text-transform: uppercase; }
.sc-trade-value { font-family: 'Space Mono', monospace; font-size: 12px; }
.sc-trade-value.stop { color: var(--red); }
.sc-trade-value.target { color: var(--green); }
.sc-trade-value.rr { color: var(--accent); }

.chase-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: #ff880020;
  color: #ff8800;
  border: 1px solid #ff880040;
  margin-top: 4px;
}

/* ── PROGRESS BAR ── */
.progress-container {
  margin-bottom: 16px;
  display: none;
}
.progress-container.visible { display: block; }

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.progress-label {
  font-size: 11px;
  color: var(--text2);
}

.progress-pct {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--accent);
}

.progress-bar-bg {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent), var(--green));
  border-radius: 4px;
  transition: width 0.3s ease;
}

.progress-current {
  margin-top: 6px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}

/* ── DETAIL VIEW ── */
.detail-view {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 200;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  max-width: 480px;
  margin: 0 auto;
}

.detail-view.open { transform: translateX(0); }

.detail-header {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
  backdrop-filter: blur(20px);
}

.back-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
}

.back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

.detail-symbol {
  font-family: 'Space Mono', monospace;
  font-size: 20px;
  font-weight: 700;
}

.detail-content {
  padding: 16px;
  padding-bottom: calc(20px + var(--safe-bottom));
}

.detail-hero {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}

.detail-hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.detail-company { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.detail-sector { font-size: 11px; color: var(--text3); }
.detail-price { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; }
.detail-score-big { font-family: 'Space Mono', monospace; font-size: 36px; font-weight: 700; text-align: right; }
.detail-score-label { font-size: 10px; color: var(--text3); text-align: right; margin-top: 2px; }

.detail-trade-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  background: var(--bg);
  border-radius: 10px;
  padding: 12px;
}

.detail-trade-item { text-align: center; }
.detail-trade-label { font-size: 9px; color: var(--text3); text-transform: uppercase; margin-bottom: 4px; }
.detail-trade-value { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; }
.detail-trade-value.stop { color: var(--red); }
.detail-trade-value.target { color: var(--green); }
.detail-trade-value.rr { color: var(--accent); }

.breakdown-list {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.breakdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}

.breakdown-item:last-child { border-bottom: none; }

.bi-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}

.bi-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.bi-icon.pass { background: var(--green-dim); color: var(--green); }
.bi-icon.fail { background: var(--red-dim); color: var(--red); }

.bi-label { font-size: 13px; color: var(--text); }
.bi-value { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text3); margin-top: 1px; }

.bi-points {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 6px;
}

/* ── SEARCH PAGE ── */
.search-bar-wrap {
  position: relative;
  margin-bottom: 16px;
}

.search-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 12px 16px 12px 44px;
  color: var(--text);
  font-size: 16px;
  font-family: 'Space Mono', monospace;
  text-transform: uppercase;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { text-transform: none; color: var(--text3); font-family: 'Noto Sans TC', sans-serif; font-size: 14px; }

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
}
.search-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

.search-btn {
  width: 100%;
  padding: 12px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 16px;
  transition: background 0.2s;
}

.search-btn:hover { background: var(--bg2); }
.search-btn:active { transform: scale(0.99); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text3);
}

.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; margin-bottom: 6px; color: var(--text2); }
.empty-sub { font-size: 12px; }

/* ── LOADING ── */
.loading-spinner {
  display: flex;
  justify-content: center;
  padding: 40px;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* ── SCAN INFO ── */
.scan-info {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  font-size: 11px;
}

.scan-info-label { color: var(--text3); }
.scan-info-value { font-family: 'Space Mono', monospace; color: var(--text2); }

/* ── ERROR TOAST ── */
.toast {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom) + 10px);
  left: 16px;
  right: 16px;
  max-width: 448px;
  margin: 0 auto;
  background: var(--red-dim);
  border: 1px solid var(--red-border);
  color: var(--red);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  z-index: 300;
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}

.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--green-dim); border-color: var(--green-border); color: var(--green); }

/* Risk-Off page tint */
body.regime-risk_off { background: #110a0a; }
body.regime-risk_off .header { background: #110a0a; }
body.regime-risk_off .nav { background: #110a0a; }
.regime-tint-bar {
  height: 3px;
  width: 100%;
  transition: background 0.5s;
}
body.regime-risk_off .regime-tint-bar { background: linear-gradient(90deg, var(--red), #ff6644, var(--red)); }
body.regime-risk_on  .regime-tint-bar { background: linear-gradient(90deg, var(--green), #44ffaa, var(--green)); }
body.regime-neutral  .regime-tint-bar { background: var(--border); }
body.regime-no_data  .regime-tint-bar { background: #444; }

/* Signal banners */
.signal-banner {
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}
.signal-banner.warning { background: #ffc93c18; border: 1px solid #ffc93c40; color: var(--yellow); }
.signal-banner.danger  { background: var(--red-dim); border: 1px solid var(--red-border); color: var(--red); }
.signal-banner.info    { background: #4fc3f718; border: 1px solid #4fc3f740; color: var(--signal-buy); }

/* VIX momentum badge */
.vix-momentum {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  margin-top: 4px;
  display: inline-block;
}
.vix-momentum.spike   { background: var(--red-dim);    color: var(--red);    border: 1px solid var(--red-border); }
.vix-momentum.surge   { background: var(--red-dim);    color: var(--red);    border: 1px solid var(--red-border); }
.vix-momentum.rising  { background: #ff880018;         color: #ff8800;       border: 1px solid #ff880040; }
.vix-momentum.falling { background: var(--green-dim);  color: var(--green);  border: 1px solid var(--green-border); }
.vix-momentum.plunging{ background: var(--green-dim);  color: var(--green);  border: 1px solid var(--green-border); }

/* SPY missing banner */
.spy-missing {
  background: #ff880018;
  border: 1px solid #ff880040;
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 12px;
  color: #ff8800;
  margin-bottom: 8px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* Not stage 2 warning */
.not-stage2-banner {
  background: #ff880018;
  border: 1px solid #ff880040;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12px;
  color: #ff8800;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-title">美股<span>選股</span>系統</div>
    <div class="header-right">
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>
      <div class="header-time" id="headerTime">--:--:--</div>
    </div>
  </header>
  <div class="regime-tint-bar" id="regimeTintBar"></div>

  <!-- PAGE 1: MARKET OVERVIEW -->
  <div class="page active" id="page-market">
    <button class="refresh-btn" id="marketRefreshBtn" onclick="refreshMarket()">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
      更新市場數據
    </button>

    <div id="marketContent">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-text">點擊「更新市場數據」載入</div>
        <div class="empty-sub">取得 SPY、QQQ、IWM、GLD 及 VIX 數據</div>
      </div>
    </div>
  </div>

  <!-- PAGE 2: SCANNER -->
  <div class="page" id="page-scanner">
    <button class="refresh-btn" id="scanRefreshBtn" onclick="startScan()">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
      掃描 S&amp;P 500（約 3-5 分鐘）
    </button>
    <button style="width:100%;padding:10px;background:transparent;border:1px solid var(--border2);border-radius:12px;color:var(--text3);font-size:12px;cursor:pointer;margin-bottom:16px;margin-top:-8px;" onclick="clearAndScan()">
      🗑 清除緩存，強制重新掃描
    </button>

    <div class="progress-container" id="scanProgress">
      <div class="progress-header">
        <span class="progress-label" id="progressLabel">掃描中...</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-current" id="progressCurrent">初始化...</div>
    </div>

    <div id="scannerContent">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">尚未執行掃描</div>
        <div class="empty-sub">點擊上方按鈕開始掃描全部 S&amp;P 500 股票<br>結果緩存 24 小時</div>
      </div>
    </div>
  </div>

  <!-- PAGE 3: SEARCH -->
  <div class="page" id="page-search">
    <div class="search-bar-wrap">
      <div class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <input type="text" class="search-input" id="searchInput" placeholder="輸入股票代號（如 AAPL）" maxlength="10"
        onkeydown="if(event.key==='Enter') searchStock()"
      >
    </div>
    <button class="search-btn" onclick="searchStock()">查詢評分</button>

    <div id="searchContent">
      <div class="empty-state">
        <div class="empty-icon">🔎</div>
        <div class="empty-text">輸入任意美股代號</div>
        <div class="empty-sub">不限 S&amp;P 500 範圍<br>系統將套用完整 15 分評分系統</div>
      </div>
    </div>
  </div>

  <!-- NAV -->
  <nav class="nav">
    <button class="nav-item active" onclick="switchPage('market', this)">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      市場環境
    </button>
    <button class="nav-item" onclick="switchPage('scanner', this)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      選股排名
    </button>
    <button class="nav-item" onclick="switchPage('search', this)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      搜索
    </button>
  </nav>

</div><!-- .app -->

<!-- DETAIL VIEW -->
<div class="detail-view" id="detailView">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetail()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="detail-symbol" id="detailSymbol"></div>
    <div style="margin-left:auto;" id="detailSignalBadge"></div>
  </div>
  <div class="detail-content" id="detailContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const API_BASE = window.location.origin;
let scanPollInterval = null;
let currentResults = [];

// ─── TIME ─────────────────────────────────────────────────────────────────────
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('headerTime').textContent = `${h}:${m}:${s}`;
}
setInterval(updateTime, 1000);
updateTime();

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function switchPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById(`page-${name}`).classList.add('active');
  btn.classList.add('active');
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg, type = 'error') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ─── MARKET ───────────────────────────────────────────────────────────────────
async function refreshMarket() {
  const btn = document.getElementById('marketRefreshBtn');
  btn.disabled = true;
  btn.classList.add('spinning');
  btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg> 更新中...`;

  try {
    const res = await fetch(`${API_BASE}/api/market`);
    const json = await res.json();
    if (json.success) {
      renderMarket(json.data);
    } else {
      showToast(json.error || '無法取得市場數據');
    }
  } catch (e) {
    showToast('連線失敗，請檢查網路');
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg> 更新市場數據`;
  }
}

function renderMarket(data) {
  const { indices, vix, regime, signals, spy_ok, updated_at } = data;
  // Apply regime tint to body
  document.body.className = document.body.className.replace(/regime-\S+/g, '');
  document.body.classList.add('regime-' + regime);
  const regimeMap = {
    risk_on:  { label: '風險偏好 Risk-On',       icon: '🚀' },
    risk_off: { label: '風險規避 Risk-Off ⚠️',   icon: '🛡️' },
    neutral:  { label: '中性觀望 Neutral',         icon: '⚖️' },
    no_data:  { label: '基準異常 — 暫停選股',      icon: '⚠️' },
  };
  const r = regimeMap[regime] || regimeMap.neutral;

  const symbols = ['SPY', 'QQQ', 'IWM', 'GLD'];
  const labels = { SPY: 'S&P 500', QQQ: 'NASDAQ', IWM: 'Russell 2K', GLD: '黃金 Gold' };

  let cardsHTML = symbols.map(sym => {
    const d = indices[sym];
    if (!d) return `<div class="market-card"><div class="mc-symbol">${sym}</div><div class="mc-price" style="color:var(--text3)">--</div></div>`;
    const dir = d.change_pct >= 0 ? 'up' : 'down';
    const arrow = d.change_pct >= 0 ? '▲' : '▼';
    const priceColor = d.change_pct >= 0 ? 'var(--green)' : 'var(--red)';
    return `
      <div class="market-card ${dir}">
        <div class="mc-symbol">${sym}</div>
        <div class="mc-price" style="color:${priceColor}">${d.price.toFixed(2)}</div>
        <div class="mc-change ${dir}">${arrow} ${Math.abs(d.change).toFixed(2)} (${d.change_pct > 0 ? '+' : ''}${d.change_pct.toFixed(2)}%)</div>
        <div class="mc-stats">
          <div class="mc-stat">
            <div class="mc-stat-label">ATR%</div>
            <div class="mc-stat-value">${d.atr_pct}%</div>
          </div>
          <div class="mc-stat">
            <div class="mc-stat-label">成交量×</div>
            <div class="mc-stat-value">${d.vol_mult}x</div>
          </div>
          <div class="mc-stat">
            <div class="mc-stat-label">RSI</div>
            <div class="mc-stat-value">${d.rsi}</div>
          </div>
          <div class="mc-stat">
            <div class="mc-stat-label">Stage</div>
            <div class="mc-stat-value">${d.stage || '--'}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  const vixLevelMap = { calm: '平靜', neutral: '中性', fear: '恐懼', extreme_fear: '極度恐懼' };
  const vixMomentumMap = { spike: '暴漲 ‼️', surge: '飆升 ⚠️', rising: '上升 ↑', falling: '下降 ↓', plunging: '急跌 ↓↓' };
  const vixHTML = vix ? (() => {
    // 🚨 PANIC CONDITION: value >= 20 OR single-day change >= 5%
    const isPanic = Number(vix.value) >= 20 || Number(vix.change_pct) >= 5;
    const vixColor = isPanic ? 'var(--red)' : vix.value > 18 ? 'var(--yellow)' : 'var(--green)';
    const vixLabel = isPanic
      ? `<div class="vix-level extreme_fear" style="font-size:13px;padding:5px 12px">恐慌 / 高波動 🚨</div>`
      : `<div class="vix-level ${vix.level}">${vixLevelMap[vix.level] || vix.level}</div>`;
    const panicBorder = isPanic ? 'border:1.5px solid var(--red);background:var(--red-dim)' : '';
    return `<div class="vix-card" style="${panicBorder}">
      <div class="vix-left">
        <div class="vix-label">CBOE 恐懼指數 VIX</div>
        <div class="vix-value" style="color:${vixColor}">${vix.value}</div>
        <div class="vix-change ${vix.change >= 0 ? 'up' : 'down'}" style="color:${vix.change >= 0 ? 'var(--red)' : 'var(--green)'}">
          ${vix.change >= 0 ? '+' : ''}${vix.change} (${vix.change_pct > 0 ? '+' : ''}${vix.change_pct}%)
        </div>
        ${vix.momentum ? `<div class="vix-momentum ${vix.momentum}">${vixMomentumMap[vix.momentum] || vix.momentum}</div>` : ''}
      </div>
      ${vixLabel}
    </div>`;
  })() : '';

  const updatedAt = data.updated_at ? new Date(data.updated_at).toLocaleTimeString('zh-TW') : '';

  document.getElementById('marketContent').innerHTML = `
    <div class="regime-banner ${regime}">
      <div>
        <div class="regime-label">市場環境判斷</div>
        <div class="regime-value">${r.label}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">基於 SPY Stage + VIX 水平</div>
      </div>
      <div class="regime-icon">${r.icon}</div>
    </div>
    <div class="section-title">四大指數</div>
    <div class="market-grid">${cardsHTML}</div>
    <div class="section-title">波動率指標</div>
    ${vixHTML}
    ${(signals||[]).map(s => `<div class="signal-banner ${s.type}">⚡ ${s.msg}</div>`).join('')}
    ${!spy_ok ? '<div class="spy-missing">⚠ SPY 基準數據異常，已切換至 QQQ 影子基準，選股排名結果僅供參考</div>' : ''}
    ${updated_at ? `<div style="text-align:right;font-size:10px;color:var(--text3);margin-top:10px">後端更新：${new Date(updated_at).toLocaleTimeString('zh-TW')}</div>` : ''}
  `;
}

// ─── SCANNER ──────────────────────────────────────────────────────────────────
async function clearAndScan() {
  try {
    await fetch(`${API_BASE}/api/scan/clear`, { method: 'POST' });
    showToast('緩存已清除', 'success');
    document.getElementById('scannerContent').innerHTML = '';
  } catch(e) {}
  await startScan();
}

async function startScan() {
  const btn = document.getElementById('scanRefreshBtn');

  // Check if already scanning
  const progressRes = await fetch(`${API_BASE}/api/scan/progress`).then(r => r.json()).catch(() => null);
  if (progressRes && progressRes.is_scanning) {
    showToast('掃描正在進行中，請稍候');
    startPollProgress();
    return;
  }

  // Check cache first
  try {
    const cacheRes = await fetch(`${API_BASE}/api/scan/results`);
    const cacheJson = await cacheRes.json();
    if (cacheJson.success) {
      renderScanResults(cacheJson.data);
      showToast('已載入緩存結果（24小時內有效）', 'success');
      return;
    }
  } catch(e) {}

  // Start new scan
  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg> 掃描中...`;

  try {
    const res = await fetch(`${API_BASE}/api/scan/start`, { method: 'POST' });
    const json = await res.json();
    if (json.success) {
      document.getElementById('scanProgress').classList.add('visible');
      document.getElementById('scannerContent').innerHTML = '';
      startPollProgress();
    } else {
      showToast(json.error || '無法開始掃描');
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg> 掃描 S&P 500（約 3-5 分鐘）`;
    }
  } catch (e) {
    showToast('連線失敗');
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg> 掃描 S&P 500（約 3-5 分鐘）`;
  }
}

function startPollProgress() {
  if (scanPollInterval) clearInterval(scanPollInterval);
  scanPollInterval = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/scan/progress`);
      const data = await res.json();

      document.getElementById('progressPct').textContent = `${data.progress}%`;
      document.getElementById('progressFill').style.width = `${data.progress}%`;
      document.getElementById('progressCurrent').textContent = data.current || '';
      document.getElementById('progressLabel').textContent = `掃描中 ${data.done}/${data.total}`;

      // Detect completion
      const isDone = (!data.is_scanning && data.progress >= 100) ||
                     (data.current && data.current.includes('完成'));
      if (isDone) {
        clearInterval(scanPollInterval);
        scanPollInterval = null;

        // Hide progress bar
        document.getElementById('scanProgress').classList.remove('visible');

        // Reset button
        const btn = document.getElementById('scanRefreshBtn');
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg> 掃描 S&P 500（約 3-5 分鐘）`;

        // Wait 1s for DB write to complete, then fetch results with retries
        let fetched = false;
        for (let attempt = 0; attempt < 5 && !fetched; attempt++) {
          await new Promise(r => setTimeout(r, 1500));
          try {
            const rRes = await fetch(`${API_BASE}/api/scan/results`);
            const rJson = await rRes.json();
            console.log(`[scan] attempt ${attempt+1}:`, rJson.success, rJson.data?.passed);
            if (rJson.success && rJson.data) {
              renderScanResults(rJson.data);
              showToast(`掃描完成！找到 ${rJson.data.passed} 支股票`, 'success');
              fetched = true;
            } else if (rJson.empty) {
              // DB not ready yet, retry
              console.log('[scan] DB not ready, retrying...');
            }
          } catch(e) { console.log('[scan] fetch error:', e); }
        }
        if (!fetched) {
          document.getElementById('scannerContent').innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">😐</div>
              <div class="empty-text">掃描完成但結果載入失敗</div>
              <div class="empty-sub">請點擊「掃描」按鈕重新載入，或稍後重試</div>
            </div>`;
        }
      }
    } catch (e) {}
  }, 2000);
}

function renderScanResults(data) {
  currentResults = data.results || [];
  const scannedAt = data.scanned_at ? new Date(data.scanned_at).toLocaleString('zh-TW') : '--';

  let html = `
    <div class="scan-info">
      <span class="scan-info-label">上次掃描</span>
      <span class="scan-info-value">${scannedAt}</span>
    </div>
    <div class="scan-info" style="margin-top:-6px">
      <span class="scan-info-label">掃描結果</span>
      <span class="scan-info-value">共 ${data.passed} 支通過篩選</span>
    </div>
  `;

  if (currentResults.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">😐</div><div class="empty-text">本次掃描無符合條件股票</div></div>`;
  } else {
    html += currentResults.map(s => renderStockCard(s)).join('');
  }

  document.getElementById('scannerContent').innerHTML = html;
}

function renderStockCard(s) {
  const mktCapStr = s.market_cap ? (s.market_cap >= 1e12 ? `${(s.market_cap/1e12).toFixed(1)}T` : `${(s.market_cap/1e9).toFixed(1)}B`) : '--';
  const chaseHTML = s.chase_risk ? `<div class="chase-badge">⚠ 追高風險</div>` : '';
  return `
    <div class="stock-card signal-${s.signal}" onclick="openDetail('${s.symbol}')">
      <div class="sc-top">
        <div class="sc-left">
          <div class="sc-rank">${(s.rank != null && s.rank !== undefined) ? "#"+s.rank : ""}</div>
          <div class="sc-symbol">${s.symbol}</div>
          <div class="sc-name">${s.company_name || ''}</div>
          <div class="sc-industry">${s.industry || s.sector || ''}</div>
        </div>
        <div class="sc-right">
          <div class="sc-score">${s.score}<span class="sc-score-max">/15</span></div>
          <div class="signal-badge signal-${s.signal}">${s.signal_label}</div>
        </div>
      </div>
      <div class="sc-stats">
        <div class="sc-stat-item">
          <div class="sc-stat-label">EPS增長</div>
          <div class="sc-stat-value" style="color:${s.eps_yoy==null?(s.breakdown?.turned_profitable?.pass?'var(--green)':'var(--text3)'):s.eps_yoy>0?'var(--green)':'var(--red)'}">${s.eps_yoy==null?(s.breakdown?.turned_profitable?.pass?'↑轉盈':'--'):(s.eps_yoy>0?'+':'')+s.eps_yoy.toFixed(1)+'%'}</div>
        </div>
        <div class="sc-stat-item">
          <div class="sc-stat-label">收入增長</div>
          <div class="sc-stat-value" style="color:${s.rev_yoy==null?'var(--text3)':s.rev_yoy>0?'var(--green)':'var(--red)'}">${s.rev_yoy==null?'--':(s.rev_yoy>0?'+':'')+s.rev_yoy.toFixed(1)+'%'}</div>
        </div>
        <div class="sc-stat-item">
          <div class="sc-stat-label">RS評級</div>
          <div class="sc-stat-value" style="color:${s.rs_rating >= 80 ? 'var(--green)' : s.rs_rating >= 60 ? 'var(--yellow)' : 'var(--text2)'}">${s.rs_rating != null ? s.rs_rating : '--'}</div>
        </div>
        <div class="sc-stat-item">
          <div class="sc-stat-label">Beta</div>
          <div class="sc-stat-value">${(s.beta != null) ? Number(s.beta).toFixed(2) : '--'}</div>
        </div>
      </div>
      <div class="sc-trade">
        <div class="sc-trade-item">
          <div class="sc-trade-label">止損</div>
          <div class="sc-trade-value stop">${s.stop_loss || '--'}</div>
        </div>
        <div class="sc-trade-item">
          <div class="sc-trade-label">目標</div>
          <div class="sc-trade-value target">${s.target || '--'}</div>
        </div>
        <div class="sc-trade-item">
          <div class="sc-trade-label">R:R</div>
          <div class="sc-trade-value rr">1:${s.rr || '--'}</div>
        </div>
      </div>
      ${chaseHTML}
    </div>`;
}

// ─── DETAIL VIEW ──────────────────────────────────────────────────────────────
function openDetail(symbol) {
  let stock = currentResults.find(s => s.symbol === symbol);

  // Try search result
  if (!stock && window._searchResult && window._searchResult.symbol === symbol) {
    stock = window._searchResult;
  }

  if (!stock) return;

  document.getElementById('detailSymbol').textContent = symbol;
  document.getElementById('detailSignalBadge').innerHTML = `<div class="signal-badge signal-${stock.signal}">${stock.signal_label}</div>`;

  const mktCapStr = stock.market_cap ? (stock.market_cap >= 1e12 ? `${(stock.market_cap/1e12).toFixed(1)}T` : `${(stock.market_cap/1e9).toFixed(1)}B`) : '--';
  const chaseHTML = stock.chase_risk ? `<div class="chase-badge" style="margin-top:8px">⚠ 追高風險：當前價格距止損位超過 1.5倍 ATR，建議等待回調</div>` : '';
  const notStage2 = stock.not_stage2 ? `<div class="not-stage2-banner">⚠ 此股票目前不在 Stage 2，不符合趨勢跟蹤條件</div>` : '';

  const breakdownHTML = Object.entries(stock.breakdown || {}).map(([key, item]) => {
    const valueStr = item.value !== undefined ? `實際值：${typeof item.value === 'number' ? item.value.toFixed(1) : item.value}` : '';
    return `
      <div class="breakdown-item">
        <div class="bi-left">
          <div class="bi-icon ${item.pass ? 'pass' : 'fail'}">${item.pass ? '✓' : '✗'}</div>
          <div>
            <div class="bi-label">${item.label}</div>
            ${valueStr ? `<div class="bi-value">${valueStr}</div>` : ''}
          </div>
        </div>
        <div class="bi-points">${item.pass ? '+' : ''}${item.pass ? item.points : 0}/${item.points}</div>
      </div>`;
  }).join('');

  document.getElementById('detailContent').innerHTML = `
    ${notStage2}
    <div class="detail-hero">
      <div class="detail-hero-top">
        <div>
          <div class="detail-company">${stock.company_name || ''}</div>
          <div class="detail-sector">${stock.industry || stock.sector || ''}</div>
          ${stock.fund_source && stock.fund_source !== 'none' ? `<div style="font-size:9px;color:var(--text3);margin-top:3px">數據來源: ${stock.fund_source}</div>` : ''}
          <div class="detail-price" style="margin-top:8px">$${stock.price}</div>
        </div>
        <div>
          <div class="detail-score-big" style="color:${scoreColor(stock.score)}">${stock.score}</div>
          <div class="detail-score-label">/ 15 分</div>
          ${stock.rank ? `<div style="font-size:10px;color:var(--text3);text-align:right;margin-top:4px">排名 #${stock.rank}</div>` : ''}
        </div>
      </div>
      ${stock.stop_loss ? `
      <div class="detail-trade-grid">
        <div class="detail-trade-item">
          <div class="detail-trade-label">止損價</div>
          <div class="detail-trade-value stop">$${stock.stop_loss}</div>
        </div>
        <div class="detail-trade-item">
          <div class="detail-trade-label">目標價</div>
          <div class="detail-trade-value target">$${stock.target}</div>
        </div>
        <div class="detail-trade-item">
          <div class="detail-trade-label">R:R 比</div>
          <div class="detail-trade-value rr">1:${stock.rr}</div>
        </div>
      </div>` : ''}
      ${chaseHTML}
    </div>

    <div class="section-title">評分細目</div>
    <div class="breakdown-list">${breakdownHTML || '<div style="padding:20px;text-align:center;color:var(--text3)">評分數據不足</div>'}</div>

    <div class="section-title" style="margin-top:20px">技術指標</div>
    <div class="breakdown-list">
      ${stock.rsi !== undefined ? `<div class="breakdown-item"><div class="bi-left"><div class="bi-icon ${stock.rsi > 70 ? 'fail' : stock.rsi < 30 ? 'pass' : 'pass'}">📊</div><div><div class="bi-label">RSI</div></div></div><div class="bi-points">${stock.rsi}</div></div>` : ''}
      ${stock.atr_pct !== undefined ? `<div class="breakdown-item"><div class="bi-left"><div class="bi-icon pass">📈</div><div><div class="bi-label">ATR%（日均波動）</div></div></div><div class="bi-points">${stock.atr_pct}%</div></div>` : ''}
      ${stock.vol_mult !== undefined ? `<div class="breakdown-item"><div class="bi-left"><div class="bi-icon ${stock.vol_mult > 1.5 ? 'pass' : 'fail'}">📦</div><div><div class="bi-label">成交量倍數</div></div></div><div class="bi-points">${stock.vol_mult}x</div></div>` : ''}
      <div class="breakdown-item"><div class="bi-left"><div class="bi-icon pass">⚡</div><div><div class="bi-label">Beta（市場敏感度）</div></div></div><div class="bi-points">${(stock.beta != null && stock.beta !== undefined) ? Number(stock.beta).toFixed(2) : '--'}</div></div>
    </div>
  `;

  document.getElementById('detailView').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
}

function scoreColor(score) {
  if (score >= 12) return 'var(--signal-strong)';
  if (score >= 9) return 'var(--signal-buy)';
  if (score >= 6) return 'var(--signal-neutral)';
  return 'var(--signal-watch)';
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
async function searchStock() {
  const input   = document.getElementById('searchInput');
  const btn     = document.querySelector('#page-search .search-btn');
  const symbol  = input.value.trim().toUpperCase();
  if (!symbol) { showToast('請輸入股票代號'); return; }

  // Validate basic format
  if (!/^[A-Z.\-]{1,10}$/.test(symbol)) {
    showToast('代號格式錯誤，請輸入英文字母'); return;
  }

  const content = document.getElementById('searchContent');

  // Loading state
  btn.disabled  = true;
  btn.textContent = '計算中...';
  content.innerHTML = `
    <div class="loading-spinner"><div class="spinner"></div></div>
    <div style="text-align:center;font-size:12px;color:var(--text3);margin-top:8px">
      正在呼叫 yfinance + FMP 即時數據，約需 10-20 秒...
    </div>`;

  try {
        // 🚀 語法校準：把那堆亂七八糟的反斜線和多餘符號全部閹割，換成標準的反單引號字串模板！
        const res = await fetch(`${API_BASE}/api/stock/${symbol}`);
        const json = await res.json();

        if (json.success && json.data) {
            const s = json.data;
            window._searchResult = s;

            // price=0 means yfinance failed
            if (!s.price || s.price === 0) {
                content.innerHTML = `
                    <div class="not-stage2-banner">
                        ⚠️ 無法取得 ${symbol} 的即時價格與技術數據！<br>
                        可能原因：非美股代號、已下市、或 API 額度耗盡。
                    </div>`;
                showToast(`${symbol} 技術數據暫時失效`, "warning");
                return;
            }

      const notStage2Banner = s.not_stage2
        ? `<div class="not-stage2-banner" style="margin-bottom:10px">
            ⚠ ${symbol} 目前不在 Stage 2 上升趨勢，止損/目標僅供參考
          </div>`
        : '';

      content.innerHTML = notStage2Banner + renderStockCard({ ...s, rank: null });
      content.querySelector('.stock-card').onclick = () => openDetail(s.symbol);
      showToast(`${symbol} 評分完成`, 'success');
    } else {
      content.innerHTML = \`
        <div class="empty-state">
          <div class="empty-icon">❌</div>
          <div class="empty-text">找不到此股票代號：\${symbol}</div>
          <div class="empty-sub">\${json.error || '請確認代號是否正確，例如 AAPL、TSLA、NVDA'}</div>
        </div>\`;
    }
  } catch (e) {
    content.innerHTML = \`
      <div class="empty-state">
        <div class="empty-icon">🌐</div>
        <div class="empty-text">連線失敗</div>
        <div class="empty-sub">請稍後再試</div>
      </div>\`;
  } finally {
    btn.disabled    = false;
    btn.textContent = '查詢評分';
  }
}

// ─── PWA ──────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.log('SW failed', err));
  });
}

// Load cached results on startup
(async () => {
  try {
    const res = await fetch(`${API_BASE}/api/scan/results`);
    const json = await res.json();
    if (json.success) {
      renderScanResults(json.data);
    }
  } catch(e) {}

  // Check if scan is in progress
  try {
    const res = await fetch(`${API_BASE}/api/scan/progress`);
    const data = await res.json();
    if (data.is_scanning) {
      document.getElementById('scanProgress').classList.add('visible');
      startPollProgress();
    }
  } catch(e) {}
})();
</script>
</body>
</html>
